<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solstice Cay — 60s Island Time-Lapse</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main class="viewport" aria-label="3D Tropical Island Time-Lapse">
    <div id="stage" class="stage">
      <canvas id="scene-canvas" aria-label="3D scene of a tropical island from late afternoon through sunset to starry night"></canvas>

      <!-- Non-blocking lower-third Start / Replay prompt -->
      <section id="prompt-card" class="prompt-card" aria-live="polite">
        <p id="prompt-eyebrow" class="prompt-eyebrow">60s Time-Lapse · Audio &amp; 3D</p>
        <h1 id="prompt-title" class="prompt-title">Solstice Cay</h1>
        <p id="prompt-sub" class="prompt-sub">Late afternoon through sunset to starry night</p>
        <button id="primary-action-btn" type="button" class="primary-btn">
          <svg id="primary-icon-play" class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l10.5-6.5L8 5.5z" fill="currentColor"></path>
          </svg>
          <svg id="primary-icon-replay" class="btn-icon hidden" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5V2L7 6l5 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"></path>
          </svg>
          <span id="primary-action-label">Start</span>
        </button>
      </section>

      <!-- Compact bottom playback HUD -->
      <nav class="hud" aria-label="Playback controls">
        <div class="hud-top-row">
          <span id="shot-badge" class="shot-badge">Shot 1/5 · Open Ocean</span>
          <span id="time-readout" class="time-readout">00:00 / 01:00</span>
        </div>

        <div id="timeline-track" class="timeline-track" role="slider" tabindex="0"
             aria-label="Scene timeline in seconds" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
          <div id="timeline-fill" class="timeline-fill"></div>
          <span class="shot-tick" style="left: 20%" aria-hidden="true"></span>
          <span class="shot-tick" style="left: 41.667%" aria-hidden="true"></span>
          <span class="shot-tick" style="left: 61.667%" aria-hidden="true"></span>
          <span class="shot-tick" style="left: 80%" aria-hidden="true"></span>
        </div>

        <div class="hud-controls-row">
          <div class="hud-left-controls">
            <button id="play-pause-btn" type="button" class="icon-btn" aria-label="Play" title="Play / Pause (Space)">
              <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M8 5.5v13l10.5-6.5L8 5.5z" fill="currentColor"></path>
              </svg>
              <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M7 5h3.5v14H7V5zm6.5 0H17v14h-3.5V5z" fill="currentColor"></path>
              </svg>
            </button>

            <button id="next-shot-btn" type="button" class="icon-btn with-label" aria-label="Skip to next shot" title="Next shot (Right Arrow)">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" fill="currentColor"></path>
              </svg>
              <span class="ctrl-text">Next Shot</span>
            </button>
          </div>

          <button id="mute-btn" type="button" class="icon-btn" aria-label="Mute audio" title="Mute / Unmute (M)">
            <svg id="icon-unmuted" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"></path>
            </svg>
            <svg id="icon-muted" class="hidden" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" fill="currentColor"></path>
            </svg>
          </button>
        </div>
      </nav>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
