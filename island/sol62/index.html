<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d15">
  <title>Last Light · An island in four shots</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="frame" aria-label="Last Light film player">
    <div id="picture" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <header class="opening" id="opening">
      <p class="eyebrow"><span></span> A ONE-MINUTE ISLAND FILM</p>
      <h1>Last<br><em>Light</em></h1>
      <p class="subtitle">From the afternoon tide<br>to the first sweep of the beacon.</p>
    </header>
    <footer id="player" class="player">
      <div class="rail" id="rail" aria-hidden="true">
        <i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i>
      </div>
      <div class="deck">
        <button type="button" id="transport" disabled>Loading…</button>
        <div class="readout">
          <span id="chapter">Offshore</span>
          <span id="clock">00:00 / 01:00</span>
        </div>
        <button type="button" id="skip" class="icon" aria-label="Next shot" title="Next shot (→)" hidden>↦</button>
        <button type="button" id="sound" class="icon" aria-label="Mute audio" title="Toggle audio (M)" hidden>♫</button>
      </div>
    </footer>
    <p id="error" role="alert" hidden>The film requires WebGL 2 and access to the Three.js CDN.</p>
  </main>
  <script type="module">
    import('./player.js').catch(error => {
      console.error(error);
      document.querySelector('#error').hidden = false;
      document.querySelector('#player').hidden = true;
    });
  </script>
</body>
</html>
