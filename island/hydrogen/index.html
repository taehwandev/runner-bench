<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Island — 60s Time-Lapse</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04060a;
      color: #f4f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #04060a;
    }

    /* Strict 9:16 portrait stage, letterboxed on wider screens, pillarboxed on taller screens */
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      overflow: hidden;
      background: #08121e;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.85);
    }

    #canvas-host {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #canvas-host canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Subtle cinematic vignette */
    .vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 58%,
        rgba(2, 4, 10, 0.42) 100%
      );
      z-index: 2;
    }

    /* Start / Replay center overlay */
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 28px;
      text-align: center;
      background: linear-gradient(
        to bottom,
        rgba(4, 8, 16, 0.25) 0%,
        rgba(4, 8, 16, 0.45) 55%,
        rgba(4, 8, 16, 0.65) 100%
      );
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .title-eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(248, 232, 200, 0.85);
    }

    .title-main {
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fffaf0;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }

    .title-sub {
      max-width: 260px;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(244, 241, 234, 0.78);
    }

    .primary-btn {
      margin-top: 8px;
      min-width: 148px;
      min-height: 46px;
      padding: 12px 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 240, 210, 0.45);
      background: rgba(18, 24, 34, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fffaf0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .primary-btn:hover {
      background: rgba(255, 232, 192, 0.22);
      border-color: rgba(255, 240, 210, 0.85);
    }

    .primary-btn:active {
      transform: scale(0.97);
    }

    /* Playback HUD */
    #hud {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 8;
      padding: 16px 16px max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: linear-gradient(to top, rgba(3, 6, 12, 0.62) 0%, rgba(3, 6, 12, 0) 100%);
      transition: opacity 0.3s ease;
    }

    #hud.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffd48a, #ff8f6b, #9eb8ff);
      border-radius: 2px;
      transition: width 0.06s linear;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(244, 241, 234, 0.82);
      font-variant-numeric: tabular-nums;
    }

    .shot-pill {
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      min-width: 40px;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(12, 16, 24, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #f7f4ec;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .hud-btn:active {
      transform: scale(0.96);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div id="canvas-host"></div>
      <div class="vignette"></div>

      <div id="overlay">
        <div class="title-eyebrow">60-Second Time-Lapse</div>
        <h1 class="title-main" id="overlay-title">Kuroshima</h1>
        <p class="title-sub" id="overlay-sub">Late afternoon through sunset to a starry night over an open-ocean tropical island.</p>
        <button class="primary-btn" id="start-btn" type="button">Start</button>
      </div>

      <div id="hud" class="hidden">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="hud-row">
          <div class="hud-meta">
            <span class="shot-pill" id="shot-label">Shot 1/5</span>
            <span id="time-label">00:00 / 01:00</span>
          </div>
          <div class="hud-controls">
            <button class="hud-btn" id="pause-btn" type="button" aria-label="Pause or Resume">Pause</button>
            <button class="hud-btn" id="next-btn" type="button" aria-label="Next Shot">Next</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
