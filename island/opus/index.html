<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Evening Isle — a 60-second time-lapse</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #f4ede2;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #000; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; transition: opacity .6s ease; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,.15), rgba(0,0,0,.65)); }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 { font-weight: 300; letter-spacing: .32em; text-transform: uppercase; font-size: clamp(18px, 5.2cqw, 46px); margin: 0 0 .4em; padding-left: .32em;
    text-shadow: 0 2px 18px rgba(0,0,0,.5); }
  .overlay p { margin: 0 0 2.2em; opacity: .75; letter-spacing: .18em; font-size: clamp(10px, 2.4cqw, 18px); text-transform: uppercase; }
  .btn { appearance: none; border: 1px solid rgba(255,240,220,.65); background: rgba(10,14,30,.35); color: #fff6ea; border-radius: 999px;
    padding: .9em 2.6em; font: inherit; letter-spacing: .3em; text-transform: uppercase; font-size: clamp(11px, 2.6cqw, 20px); cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background .2s, transform .2s; }
  .btn:hover { background: rgba(255,200,150,.18); transform: scale(1.03); }
  #stage { container-type: inline-size; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 4.5% 4.5%; transition: opacity .5s ease; }
  #hud.idle { opacity: 0; }
  #hud.off { display: none; }
  #bar { display: flex; gap: 4px; height: 3px; margin-bottom: 12px; }
  #bar .seg { position: relative; background: rgba(255,255,255,.22); border-radius: 2px; overflow: hidden; }
  #bar .seg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,236,210,.95); }
  #row { display: flex; align-items: center; gap: 10px; }
  #row .lbl { flex: 1; font-size: clamp(9px, 2.3cqw, 15px); letter-spacing: .22em; text-transform: uppercase; opacity: .85; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .ibtn { appearance: none; border: 0; background: rgba(0,0,0,.28); color: #fff; width: clamp(34px, 9cqw, 52px); height: clamp(34px, 9cqw, 52px); border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ibtn svg { width: 46%; height: 46%; fill: currentColor; }
  #pausedBadge { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); pointer-events: none; opacity: 0; transition: opacity .25s;
    width: clamp(56px, 16cqw, 96px); height: clamp(56px, 16cqw, 96px); border-radius: 50%; background: rgba(0,0,0,.35); display: grid; place-items: center; }
  #pausedBadge.on { opacity: 1; }
  #pausedBadge svg { width: 40%; fill: #fff; }
  #hint { position: absolute; bottom: 6%; left: 0; right: 0; font-size: clamp(8px, 1.9cqw, 13px); opacity: .55; letter-spacing: .14em; text-transform: uppercase; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="pausedBadge"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></div>
  <div id="hud" class="off">
    <div id="bar"></div>
    <div id="row">
      <div class="lbl" id="shotLbl"></div>
      <button class="ibtn" id="btnPause" aria-label="Pause / resume"><svg viewBox="0 0 24 24" id="icoPause"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
      <button class="ibtn" id="btnNext" aria-label="Next shot"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5h3v14h-3z"/></svg></button>
    </div>
  </div>
  <div class="overlay" id="startOv">
    <h1>Evening Isle</h1>
    <p>a sixty-second time-lapse</p>
    <button class="btn" id="btnStart">Start</button>
    <div id="hint">Tap / Space: pause · Swipe left / → : next shot</div>
  </div>
  <div class="overlay hidden" id="endOv">
    <h1>Evening Isle</h1>
    <p>&nbsp;</p>
    <button class="btn" id="btnReplay">Replay</button>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
