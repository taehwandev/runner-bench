<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center;background:#111817;color:#fbf0d8;font-family:Helvetica Neue,Arial,sans-serif}.film{width:min(100vw,56.25vh);width:min(100vw,56.25dvh);aspect-ratio:9/16;position:relative;overflow:hidden;background:#6eaaa4;container-type:inline-size;isolation:isolate}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#051d24ba,transparent 43%,transparent 88%,#18302b24)}header,footer,.cover,.live{position:absolute;left:7%;right:7%}header,footer,.live,.kicker,.start{font:600 2.13cqw/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}header{top:4.4%;display:flex;align-items:center;justify-content:space-between;text-shadow:0 1px 6px #37515260}.brand{display:flex;align-items:center;gap:2cqw}.logo{width:5.8cqw;height:4.7cqw}.cover{bottom:9.4%;color:#fff4dd}.kicker{display:flex;align-items:center;gap:2.5cqw}.kicker:before{content:"";width:7cqw;height:1px;background:currentColor}h1{font:normal 15.3cqw/.89 Georgia,'Times New Roman',serif;letter-spacing:-.079em;margin:3.1cqw 0 4.2cqw}h1 em{font-weight:400}.start,button{pointer-events:auto;cursor:pointer;color:inherit}.start{border:1px solid #ecd9b39c;border-radius:999px;background:#112d2b55;padding:2.7cqw 4.1cqw;display:flex;align-items:center;gap:2.4cqw;backdrop-filter:blur(6px)}button:focus-visible{outline:2px solid white;outline-offset:3px}.tri{width:0;height:0;border-top:.78cqw solid transparent;border-bottom:.78cqw solid transparent;border-left:1.25cqw solid currentColor}footer{bottom:3.2%;display:flex;align-items:center;gap:2.6cqw;letter-spacing:.09em;font-size:1.95cqw}.track{display:flex;gap:1cqw;flex:1}.seg{height:2px;flex:1;background:#f5edcd4d}.seg i{display:block;height:100%;background:#fff1cf;transform-origin:left}.live{bottom:7%;display:flex;align-items:center;justify-content:space-between}.controls{display:flex;gap:1cqw}.controls button{width:max(36px,8cqw);height:max(36px,8cqw);background:#10272975;border:1px solid #e7e0c555;border-radius:100%;font-size:3cqw}.live[hidden],.cover[hidden]{display:none}#phase{font-weight:400;display:block;margin-top:1.4cqw;letter-spacing:.07em}.error{position:absolute;inset:40% 8% auto;text-align:center}
