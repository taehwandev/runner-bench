<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aero-X1 // Interactive Spaceship Flight Simulator</title>
  <meta name="description" content="Interactive 3D spaceship test flight simulator with landing pad, local circuit, and camera controls" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 3D Canvas Rendering Container -->
  <div id="canvas-container"></div>

  <!-- Interactive Sci-Fi UI Overlay -->
  <div id="ui-overlay">
    <!-- Top Navigation Bar -->
    <header class="top-bar hud-panel">
      <div class="brand-section">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
        <div>
          <div class="brand-title">AERO-X1 // FLIGHT TEST</div>
          <div class="brand-sub">LOCAL CIRCUIT &bull; PAD LP-01</div>
        </div>
      </div>

      <!-- Current Flight Phase Status Badge -->
      <div id="status-badge" class="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">READY ON PAD</span>
      </div>

      <!-- Top Quick Action Buttons -->
      <div class="top-actions">
        <button id="btn-audio" class="icon-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">
          <svg id="icon-sound-on" class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="icon-sound-off" class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button id="btn-fullscreen" class="icon-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Middle Workspace: Camera Toolbar on Left, Telemetry HUD on Right -->
    <main class="middle-area">
      <!-- Camera Toolbar -->
      <div class="camera-toolbar hud-panel">
        <div class="camera-label">Camera Perspective</div>
        <div class="camera-modes">
          <button class="cam-mode-btn active" data-mode="DIRECTOR" title="Director Tracking View">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 7l-7 5 7 5V7z"></path>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            Director
          </button>
          <button class="cam-mode-btn" data-mode="CHASE" title="Third-Person Chase View">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
            </svg>
            Chase
          </button>
          <button class="cam-mode-btn" data-mode="TOWER" title="Tower Observation View">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            Tower
          </button>
          <button class="cam-mode-btn" data-mode="FREE" title="Free Orbit View">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <ellipse cx="12" cy="12" rx="10" ry="6"></ellipse>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
            Free Orbit
          </button>
        </div>

        <!-- Camera Actions: Reset, Zoom In, Zoom Out -->
        <div class="camera-actions">
          <button id="btn-cam-reset" class="cam-action-btn" title="Reset Camera to Default Framing (R)">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <polyline points="3 3 3 8 8 8"></polyline>
            </svg>
            Reset
          </button>
          <button id="btn-zoom-in" class="cam-action-btn" title="Zoom In (+)">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
            +
          </button>
          <button id="btn-zoom-out" class="cam-action-btn" title="Zoom Out (-)">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
            &minus;
          </button>
        </div>
      </div>

      <!-- Telemetry Card (Right) -->
      <div class="telemetry-card hud-panel">
        <div class="telemetry-header">
          <span class="telemetry-title">Telemetry</span>
          <span id="telemetry-time" class="telemetry-time">00:00.0</span>
        </div>

        <!-- Altitude -->
        <div class="metric-group">
          <div class="metric-label-row">
            <span>Altitude</span>
            <span id="metric-alt-max">MAX 26m</span>
          </div>
          <div class="metric-value-row">
            <span id="val-altitude" class="metric-number">0.0</span>
            <span class="metric-unit">m</span>
          </div>
          <div class="metric-bar-bg">
            <div id="bar-altitude" class="metric-bar-fill"></div>
          </div>
        </div>

        <!-- Speed -->
        <div class="metric-group">
          <div class="metric-label-row">
            <span>Speed</span>
            <span id="metric-spd-max">AIRSPEED</span>
          </div>
          <div class="metric-value-row">
            <span id="val-speed" class="metric-number">0.0</span>
            <span class="metric-unit">km/h</span>
          </div>
          <div class="metric-bar-bg">
            <div id="bar-speed" class="metric-bar-fill"></div>
          </div>
        </div>

        <!-- Throttle -->
        <div class="metric-group">
          <div class="metric-label-row">
            <span>Throttle</span>
            <span id="val-throttle-pct">10%</span>
          </div>
          <div class="metric-bar-bg">
            <div id="bar-throttle" class="metric-bar-fill"></div>
          </div>
        </div>

        <!-- Circuit Progress Tracker -->
        <div class="circuit-tracker">
          <span class="circuit-label">Circuit Flight</span>
          <span id="val-circuit-pct" class="circuit-pct">0%</span>
        </div>
      </div>
    </main>

    <!-- Bottom Flight Control Deck -->
    <footer class="bottom-area">
      <div class="control-deck hud-panel">
        <!-- Main Action Button -->
        <button id="btn-launch-flight" class="primary-launch-btn">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
          <span id="launch-btn-text">INITIATE TAKEOFF</span>
        </button>

        <!-- Secondary Flight Options -->
        <div class="deck-secondary-controls">
          <button id="btn-pause-flight" class="deck-btn" title="Pause / Resume Flight (P)" aria-label="Pause or Resume Flight">
            <svg id="icon-pause" class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            <span class="btn-label" id="pause-btn-text">Pause</span>
          </button>

          <button id="btn-speed-toggle" class="deck-btn" title="Toggle Speed Multiplier (1/2/3)" aria-label="Toggle Speed">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span id="speed-label">1.0x</span>
          </button>

          <button id="btn-trajectory-toggle" class="deck-btn active" title="Toggle Flight Path Ribbon" aria-label="Toggle Flight Path Ribbon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
              <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
            <span class="btn-label">Path</span>
          </button>
        </div>
      </div>

      <!-- User Interaction Gesture Hint -->
      <div class="gesture-hint">
        <span>Drag to Orbit &bull; Scroll / Pinch to Zoom &bull; Right-Click to Pan</span>
      </div>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
