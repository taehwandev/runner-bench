<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive 3D scene: a small spaceship hovers above a landing pad, circles it once, then flies off into the distance.">
<title>Landing Pad Departure · 3D</title>
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="stage" role="img" aria-label="3D view of a small spaceship hovering above a landing pad in a sunny landscape"></div>

<header class="hud">
  <h1>Landing Pad Departure</h1>
  <p id="status" role="status" aria-live="polite">Loading scene…</p>
  <p class="hint">Drag to orbit · Scroll or pinch to zoom · Space to depart · F follow · R reset</p>
</header>

<nav class="dock" aria-label="Scene controls">
  <button id="depart" class="btn btn-primary" type="button">Depart</button>
  <button id="follow" class="btn" type="button" aria-pressed="false">Follow ship</button>
  <div class="zoom" role="group" aria-label="Zoom">
    <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in">+</button>
  </div>
  <button id="reset" class="btn" type="button">Reset camera</button>
</nav>

<script>
  // Shown only if the Three.js module could not be loaded (e.g. the CDN is blocked offline).
  setTimeout(() => {
    if (!window.__padReady) {
      document.getElementById('status').textContent =
        '3D engine did not load. Check your connection and reload the page.';
    }
  }, 12000);
</script>

<script type="module" src="main.js"></script>
</body>
</html>
