<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e15">
  <title>White Meridian</title>
  <link rel="stylesheet" href="./film.css">
  <script type="module" src="./film.js"></script>
</head>
<body>
  <main id="frame" aria-label="White Meridian, a one-minute winter rail film">
    <canvas id="film" aria-label="Cinematic view of an armored train crossing a frozen city"></canvas>
    <div class="edge" aria-hidden="true"></div>
    <section id="splash" aria-labelledby="title">
      <div class="splash-copy">
        <span class="title-rule" aria-hidden="true"></span>
        <h1 id="title">White<br>Meridian</h1>
        <p id="intro">A winter rail film <span aria-hidden="true">·</span> 1 min</p>
        <button id="start" type="button" disabled><i class="play-icon" aria-hidden="true"></i><span>Start</span></button>
        <p id="error" role="alert" hidden>White Meridian needs a browser with WebGL 2 enabled.</p>
      </div>
    </section>
    <div id="transport" hidden>
      <div class="timeline" aria-hidden="true"><span id="progress"></span></div>
      <div class="controls">
        <button id="pause" aria-label="Pause" title="Pause or resume (Space)" type="button"><i class="pause-icon" aria-hidden="true"></i></button>
        <button id="skip" aria-label="Next shot" title="Next shot (Right arrow)" type="button"><i class="skip-icon" aria-hidden="true"></i></button>
        <time id="timecode" aria-label="Elapsed time">0:00</time>
        <button id="sound" aria-label="Mute sound" aria-pressed="false" title="Toggle sound (M)" type="button"><i aria-hidden="true"></i></button>
      </div>
    </div>
  </main>
</body>
</html>
