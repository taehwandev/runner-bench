<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rocket Launch · 3D</title>
<style>
  :root {
    --panel: rgba(12, 22, 36, 0.55);
    --text: #f5f8fb;
    --muted: #c3d3e0;
    --amber: #ffd27a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: #9fd3f0;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  .panel {
    position: fixed;
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  }

  .title { top: 16px; left: 16px; padding: 12px 16px; max-width: 260px; }
  .title h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
  .title p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  .telemetry {
    top: 16px; right: 16px;
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 10px 24px;
    padding: 12px 16px;
  }
  .telemetry span {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .telemetry strong { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #status { color: var(--amber); }

  .countdown {
    position: fixed;
    left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    font-size: clamp(64px, 14vw, 160px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .countdown.show { opacity: 1; }
  .countdown.pulse { animation: pulse 0.9s ease-out; }
  .countdown.paused { animation-play-state: paused; }
  @keyframes pulse {
    0%   { transform: translate(-50%, -50%) scale(1.25); opacity: 0.2; }
    30%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .controls {
    left: 50%;
    bottom: calc(44px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 10px;
  }
  .btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    min-height: 44px;
    min-width: 44px;
    padding: 0 16px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s, background 0.2s, opacity 0.2s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.2); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn[aria-pressed="false"] { opacity: 0.75; }
  .btn.primary {
    background: linear-gradient(135deg, #ff8a3d, #ff4d2e);
    border-color: transparent;
    padding: 0 28px;
    font-size: 16px;
    box-shadow: 0 6px 18px rgba(255, 90, 40, 0.4);
  }
  .btn.primary.abort { background: linear-gradient(135deg, #8d99a8, #56606d); box-shadow: none; }
  .btn.primary.reflight {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
    animation: reflightPulse 1.8s infinite ease-in-out;
  }
  @keyframes reflightPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45); }
    50% { transform: scale(1.03); box-shadow: 0 8px 24px rgba(16, 185, 129, 0.7); }
  }

  .pip-panel {
    position: fixed;
    right: 18px;
    bottom: 95px;
    width: 250px;
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    z-index: 45;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
  }
  .pip-panel:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.5);
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55);
  }
  .pip-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 12px;
    background: rgba(0, 0, 0, 0.4);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #fff;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .pip-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #ff4d2e;
    border-radius: 50%;
    margin-right: 6px;
    animation: pipBlink 1s infinite alternate;
  }
  @keyframes pipBlink { 0% { opacity: 0.3; } 100% { opacity: 1; } }
  .pip-viewport {
    width: 100%;
    height: 140px;
    background: #090e17;
    position: relative;
  }
  .pip-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.45);
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    gap: 8px;
  }
  .pip-footer strong { color: var(--text); }
  .pip-btn {
    appearance: none;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    border-radius: 6px;
    font: inherit;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .pip-btn:hover { background: rgba(255, 255, 255, 0.35); }

  .hint {
    position: fixed;
    left: 50%; bottom: 12px;
    transform: translateX(-50%);
    margin: 0;
    font-size: 12px;
    color: #fff;
    background: rgba(0, 0, 0, 0.25);
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .pip-panel { right: 10px; bottom: calc(140px + env(safe-area-inset-bottom)); width: 170px; }
    .pip-viewport { height: 100px; }
    .title { top: 10px; left: 10px; right: 10px; max-width: none; padding: 8px 12px; }
    .title h1 { font-size: 15px; }
    .title p { font-size: 11px; }
    .telemetry {
      top: 70px; left: 10px; right: 10px;
      grid-template-columns: 1.2fr 1.5fr 1fr 1fr;
      gap: 8px;
      padding: 8px 10px;
    }
    .telemetry span { font-size: 9px; letter-spacing: 0.04em; }
    .telemetry strong { font-size: 13px; white-space: normal; }
    .controls {
      left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
      transform: none; width: auto; max-width: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .controls .primary { grid-column: 1 / -1; min-height: 52px; }
    .btn { min-height: 48px; padding: 0 8px; font-size: 13px; }
    .hint { display: none; }
  }

  @media (max-height: 500px) and (orientation: landscape), (max-height: 460px) {
    .pip-panel { right: calc(10px + env(safe-area-inset-right)); bottom: calc(48px + env(safe-area-inset-bottom)); width: 155px; }
    .pip-viewport { height: 90px; }
    .hint { display: none !important; }
    .title {
      top: 8px; left: calc(8px + env(safe-area-inset-left));
      right: auto; max-width: 220px;
      padding: 6px 10px;
      border-radius: 10px;
    }
    .title h1 { font-size: 13px; }
    .title p { font-size: 10px; margin: 2px 0 0; }
    .telemetry {
      top: 8px; right: calc(8px + env(safe-area-inset-right));
      left: auto;
      grid-template-columns: repeat(2, auto);
      gap: 4px 16px;
      padding: 6px 10px;
      border-radius: 10px;
    }
    .telemetry span { font-size: 9px; letter-spacing: 0.04em; }
    .telemetry strong { font-size: 12px; white-space: nowrap; }
    .controls {
      left: 50%;
      right: auto;
      bottom: calc(8px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
      max-height: calc(100vh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 6px;
      padding: 5px 8px;
      border-radius: 12px;
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .controls::-webkit-scrollbar { display: none; }
    .btn {
      min-height: 34px;
      min-width: 32px;
      padding: 0 8px;
      font-size: 12px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .controls .primary {
      grid-column: auto;
      min-height: 34px;
      padding: 0 14px;
      font-size: 12px;
    }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene" aria-label="3D view of a rocket on a launch pad"></canvas>

<header class="panel title">
  <h1>Launch Complex</h1>
  <p>Drag to orbit · Scroll or pinch to zoom</p>
  <div id="flightBadge" style="display: none; font-size: 11px; color: #10b981; font-weight: 700; margin-top: 4px; letter-spacing: 0.04em;"></div>
</header>

<section class="panel telemetry" aria-live="polite">
  <div><span>Status</span><strong id="status">Standing by</strong></div>
  <div><span>Mission time</span><strong id="met">—</strong></div>
  <div><span>Altitude</span><strong id="alt">0 m</strong></div>
  <div><span>Speed</span><strong id="spd">0 m/s</strong></div>
</section>

<div id="count" class="countdown" aria-live="assertive"></div>

<nav class="panel controls" aria-label="Launch and camera controls">
  <button id="launch" class="btn primary" type="button">Launch</button>
  <button id="reflightBtn" class="btn primary reflight" type="button" style="display: none;">Refly Rocket</button>
  <button id="pause" class="btn" type="button" disabled>Pause</button>
  <button id="camToggle" class="btn" type="button" style="display: none;">View: Booster</button>
  <button id="zoomOut" class="btn" type="button" aria-label="Zoom out">Zoom −</button>
  <button id="zoomIn" class="btn" type="button" aria-label="Zoom in">Zoom +</button>
  <button id="follow" class="btn" type="button" aria-pressed="true">Follow: on</button>
  <button id="resetCam" class="btn" type="button">Reset camera</button>
  <button id="resetRocket" class="btn" type="button">Reset rocket</button>
</nav>

<div id="pipOverlay" class="panel pip-panel" style="display: none;" title="Click to swap camera view">
  <div class="pip-header">
    <span><span class="pip-dot"></span><span id="pipTitle">STAGE 1 · RECOVERY</span></span>
    <button id="pipBtn" class="pip-btn" type="button" aria-label="Swap main and picture-in-picture views">⇄ Swap View</button>
  </div>
  <div id="pipViewport" class="pip-viewport"></div>
  <div class="pip-footer">
    <span id="pipStatus">Braking burn</span>
    <span id="pipAlt">0 m</span>
    <span id="pipSpd">0 m/s</span>
  </div>
</div>

<p class="hint desk-only">Space: launch · R: reset camera · B: toggle view · +/−: zoom</p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- Tunables ---------- */
const PAD_Y = 3;                       // top of the launch mount; the nozzle sits here
const COUNTDOWN = 10;                  // seconds
const STAGE_TIME = 18;               // separation after the vehicle clears the tower
const STAGE_Y = 14;                  // joint above the first-stage nozzle
const IGNITION_TIME = 3;               // engine build-up before the hold-down releases
const ASCENT_V = 85, ASCENT_TAU = 4;   // vertical speed target (m/s) and response time (s)
const DRIFT_V = 110, DRIFT_TAU = 5;    // downrange speed target and response time
const DRIFT_START = 5;                 // seconds before the pitch-over begins
const AZIMUTH = -0.55;                 // heading of travel (radians)
const BODY_CENTER = 16;                // orbit pivot height above the nozzle, the middle of the hull
const HOME_TARGET = new THREE.Vector3(0, PAD_Y + BODY_CENTER, 0);
const HOME_POS = new THREE.Vector3(46, 20 + (HOME_TARGET.y - 15), 62);   // same view angle as before, shifted with the target
const SUN_DIR = new THREE.Vector3(80, 140, -60).normalize();
const UP = new THREE.Vector3(0, 1, 0);

/* ---------- Renderer, scene, camera ---------- */
const $ = id => document.getElementById(id);
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xcde9f7);
scene.fog = new THREE.Fog(HORIZON, 700, 4500);

const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 12000);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;            // pan would fight the follow camera and two-finger zoom on touch
controls.minDistance = 14;
controls.maxDistance = 400;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

/* ---------- Sky ---------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    top: { value: new THREE.Color(0x3b7fdc) },
    horizon: { value: HORIZON },
    bottom: { value: new THREE.Color(0xbfe6f5) },
    sunDir: { value: SUN_DIR },
    space: { value: 0 },
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; uniform vec3 sunDir; uniform float space;
    varying vec3 vDir;
    void main() {
      float h = vDir.y;
      vec3 col = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, bottom, min(-h * 4.0, 1.0));
      float s = max(dot(normalize(vDir), sunDir), 0.0);
      col += vec3(1.0, 0.95, 0.8) * (pow(s, 600.0) * 1.5 + pow(s, 8.0) * 0.25);
      col = mix(col, vec3(0.002, 0.004, 0.015), space);
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 32, 16), skyMat);
sky.frustumCulled = false;
scene.add(sky);
const starPositions = [];
const starRand = mulberry32(8942);
for (let i = 0; i < 1800; i++) {
  const y = starRand() * 2 - 1, a = starRand() * Math.PI * 2;
  const r = Math.sqrt(1 - y * y) * 5500;
  starPositions.push(Math.cos(a) * r, y * 5500, Math.sin(a) * r);
}
const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 5, transparent: true, opacity: 0, depthWrite: false, fog: false });
const stars = new THREE.Points(starGeometry, starMaterial);
stars.frustumCulled = false;
scene.add(stars);

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight(0xcfeeff, 0x5d8a3c, 1.4));
const sun = new THREE.DirectionalLight(0xfff3dc, 2.4);
sun.position.copy(SUN_DIR).multiplyScalar(200);
scene.add(sun);
const exhaustLight = new THREE.PointLight(0xff9a3c, 0, 90, 2);
scene.add(exhaustLight);
const boosterLight = new THREE.PointLight(0xff9a3c, 0, 90, 2);
scene.add(boosterLight);

/* ---------- Helpers ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(2026);         // scenery layout is seeded so it's identical every load

function box(parent, mat, size, pos) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(...size), mat);
  m.position.set(...pos);
  parent.add(m);
  return m;
}

function makeGroundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#6fa34b';
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `hsla(${95 + rand() * 25}, ${40 + rand() * 25}%, ${30 + rand() * 25}%, 0.25)`;
    g.beginPath();
    g.arc(rand() * 256, rand() * 256, 1 + rand() * 4, 0, Math.PI * 2);
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(200, 200);
  t.anisotropy = 8;
  return t;
}

// Everything that belongs to the ground; hidden once the spacecraft is in orbit
const terrain = new THREE.Group();
scene.add(terrain);

/* ---------- Ground ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(12000, 12000),
  new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
terrain.add(ground);

/* ---------- Launch complex ---------- */
const concrete = new THREE.MeshStandardMaterial({ color: 0xcfcbc1, roughness: 0.95 });
const steel = new THREE.MeshStandardMaterial({ color: 0x8c97a3, metalness: 0.55, roughness: 0.45 });

// Apron and a square mount with a 4×4 flame hole in the middle
const pad = new THREE.Group();
terrain.add(pad);
box(pad, concrete, [70, 0.06, 70], [0, 0.03, 0]);
box(pad, concrete, [12, 3, 4], [0, 1.5, 4]);
box(pad, concrete, [12, 3, 4], [0, 1.5, -4]);
box(pad, concrete, [4, 3, 4], [4, 1.5, 0]);
box(pad, concrete, [4, 3, 4], [-4, 1.5, 0]);

// Lightning/service tower beside the pad
const tower = new THREE.Group();
tower.position.set(-12, 0, 0);
terrain.add(tower);
for (const [x, z] of [[-2, -2], [2, -2], [-2, 2], [2, 2]]) box(tower, steel, [0.5, 40, 0.5], [x, 20, z]);
for (let y = 4; y <= 38; y += 4) {
  box(tower, steel, [4.5, 0.35, 0.35], [0, y, -2]);
  box(tower, steel, [4.5, 0.35, 0.35], [0, y, 2]);
  box(tower, steel, [0.35, 0.35, 4.5], [-2, y, 0]);
  box(tower, steel, [0.35, 0.35, 4.5], [2, y, 0]);
}
box(tower, steel, [5.5, 0.6, 5.5], [0, 40, 0]);

/* ---------- Landing Complex (LZ-1) ---------- */
const LZ_POS = new THREE.Vector3(80, 0, -45);
const LZ_PAD_Y = 0.36;

function makeLandingPad() {
  const lz = new THREE.Group();
  lz.position.copy(LZ_POS);

  const baseMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(24, 25, 0.35, 48),
    new THREE.MeshStandardMaterial({ color: 0x32353a, roughness: 0.92 })
  );
  baseMesh.position.y = 0.175;
  lz.add(baseMesh);

  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#22252a';
  g.fillRect(0, 0, 512, 512);

  // Yellow/black perimeter hazard ring
  g.strokeStyle = '#f5c533';
  g.lineWidth = 14;
  g.beginPath();
  g.arc(256, 256, 238, 0, Math.PI * 2);
  g.stroke();

  // White concentric circles
  g.strokeStyle = '#ffffff';
  g.lineWidth = 6;
  g.beginPath();
  g.arc(256, 256, 210, 0, Math.PI * 2);
  g.stroke();

  g.beginPath();
  g.arc(256, 256, 92, 0, Math.PI * 2);
  g.stroke();

  g.fillStyle = '#ffffff';
  g.beginPath();
  g.arc(256, 256, 18, 0, Math.PI * 2);
  g.fill();

  // Iconic SpaceX landing 'X'
  g.strokeStyle = '#ffffff';
  g.lineWidth = 18;
  g.beginPath();
  g.moveTo(135, 135); g.lineTo(377, 377);
  g.moveTo(377, 135); g.lineTo(135, 377);
  g.stroke();

  // Radial alignment markings
  g.lineWidth = 4;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
    g.beginPath();
    g.moveTo(256 + Math.cos(a) * 92, 256 + Math.sin(a) * 92);
    g.lineTo(256 + Math.cos(a) * 210, 256 + Math.sin(a) * 210);
    g.stroke();
  }

  g.font = 'bold 20px system-ui, sans-serif';
  g.fillStyle = '#e2ecf5';
  g.textAlign = 'center';
  g.fillText('LANDING ZONE 1', 256, 75);
  g.fillText('SPACEX RECOVERY', 256, 452);

  const padTexture = new THREE.CanvasTexture(c);
  padTexture.colorSpace = THREE.SRGBColorSpace;
  const padSurface = new THREE.Mesh(
    new THREE.CircleGeometry(24, 48),
    new THREE.MeshStandardMaterial({ map: padTexture, roughness: 0.85 })
  );
  padSurface.rotation.x = -Math.PI / 2;
  padSurface.position.y = LZ_PAD_Y;
  lz.add(padSurface);

  // Perimeter light towers

function setGridFinsDeploy(amount, steer = 0) {
  const angle = amount * (Math.PI / 2);

function applyBoosterSoot(flights) {

    const sootFactor = Math.min(1, (flights - 1) * 0.45);

    boosterHullMat.roughness = 0.35 + sootFactor * 0.25;
    sootMat.opacity = Math.min(0.85, 0.4 + sootFactor * 0.4);
  }

function spawn(pool, o) {
  const p = pool.find(q => !q.alive);
  if (!p) return;
  p.alive = true;
  p.t = 0;
  p.life = o.life;
  p.drag = o.drag;
  p.buoy = o.buoy;
  p.s0 = o.s0;
  p.s1 = o.s1;
  p.a = o.a;
  p.sprite.position.copy(o.pos);
  p.vel.copy(o.vel);
  p.c0.copy(o.c0);
  p.c1.copy(o.c1);
  p.sprite.visible = true;
}

function updateParticles(dt) {
  for (const pool of [flamePool, smokePool]) {
    for (const p of pool) {
      if (!p.alive) continue;
      p.t += dt;
      const f = p.t / p.life;
      if (f >= 1) { p.alive = false; p.sprite.visible = false; continue; }
      p.vel.multiplyScalar(Math.exp(-p.drag * dt));
      p.vel.y += p.buoy * dt;
      p.sprite.position.addScaledVector(p.vel, dt);
      if (p.sprite.position.y < 0.6) {          // flames spread along the ground instead of sinking into it
        p.sprite.position.y = 0.6;
        p.vel.y = Math.abs(p.vel.y) * 0.25;
        p.vel.x *= 0.9;
        p.vel.z *= 0.9;
      }
      const s = THREE.MathUtils.lerp(p.s0, p.s1, f);
      p.sprite.scale.set(s, s, 1);
      p.mat.color.copy(p.c0).lerp(p.c1, f);
      p.mat.opacity = p.a * Math.min(1, f * 5) * (1 - f);
    }
  }
}

// Closed-form ascent: rises quickly, then pitches over and keeps climbing away (never returns).
function flightState(s) {
  const u = Math.max(0, s - DRIFT_START);
  const ev = Math.exp(-s / ASCENT_TAU);
  const ed = Math.exp(-u / DRIFT_TAU);
  return {
    x: DRIFT_V * (u - DRIFT_TAU * (1 - ed)),   // downrange distance
    y: ASCENT_V * (s - ASCENT_TAU * (1 - ev)), // altitude above the pad
    vx: DRIFT_V * (1 - ed),
    vy: ASCENT_V * (1 - ev),
  };
}

/* ---------- Mission: Earth orbit, trans-lunar coast, lunar orbit ---------- */
// Stylised scale: the planets are sized and spaced for the camera, not to scale with the pad.
const EARTH_R = 900, LEO_ALT = 200, ORBIT_R = EARTH_R + LEO_ALT;
const ORBIT_LAP = 40;                              // seconds per lap of Earth orbit
const ORBIT_W = Math.PI * 2 / ORBIT_LAP;          // angular rate in orbit (rad/s)
const T_INS = 60;                                 // orbit insertion: the ascent curve hands off to orbit here
const CIRC = 4;                                   // seconds to blend the ascent curve onto the orbit
const T_TLI = T_INS + ORBIT_LAP;                  // trans-lunar injection, after one full lap
const TLI_BURN = 3;                               // seconds of TLI burn
const TRANSIT = 30;                               // coast from TLI to lunar insertion
const LOI_BURN = 4;                               // retro burn at the end of the coast
const T_ARR = T_TLI + TRANSIT;
const MOON_R = 300, LOI_ALT = 100, MOON_ORBIT_R = MOON_R + LOI_ALT;
const MOON_DIST = 4200;                           // Earth centre to Moon centre
const MOON_LAP = 30;
const MOON_W = Math.PI * 2 / MOON_LAP;
const T_DEPART = T_ARR + MOON_LAP;
const T_RETURN = T_DEPART + 35;
const T_SEPARATE = T_RETURN - 5;
const T_CHUTES = T_RETURN + 9;
const T_SPLASH = T_RETURN + 20;
const T_END = T_SPLASH + 5;
const SHOT_TIME = 2.5;                            // seconds for a camera framing change

const HDIR = new THREE.Vector3(Math.cos(AZIMUTH), 0, Math.sin(AZIMUTH));   // direction of travel at insertion
const insertion = flightState(T_INS);
const INS_POS = new THREE.Vector3(insertion.x * Math.cos(AZIMUTH), PAD_Y + insertion.y, insertion.x * Math.sin(AZIMUTH));
const EARTH_C = INS_POS.clone().addScaledVector(UP, -ORBIT_R);
const MOON_C = EARTH_C.clone().addScaledVector(UP, ORBIT_R).addScaledVector(HDIR, Math.sqrt(MOON_DIST ** 2 - ORBIT_R ** 2));
const LOI_POS = MOON_C.clone().addScaledVector(UP, MOON_ORBIT_R);   // arrival point, above the Moon, moving along HDIR
const TRANSFER_LEN = LOI_POS.distanceTo(INS_POS);
const LANDING = EARTH_C.clone().addScaledVector(UP, EARTH_R);
const ENTRY = LANDING.clone().addScaledVector(UP, 120);
const returnCurve = new THREE.CubicBezierCurve3(
  LOI_POS, LOI_POS.clone().addScaledVector(HDIR, 900),
  ENTRY.clone().addScaledVector(HDIR, 1200).addScaledVector(UP, 500), ENTRY
);
// Coast profile: a cubic Hermite from TLI to lunar insertion, timed so the speed follows the burns at both ends
const V_TLI = ORBIT_R * ORBIT_W * 1.3;            // speed after the TLI burn
const V_LOI = MOON_ORBIT_R * MOON_W;              // speed in lunar orbit
const A0 = V_TLI * TRANSIT / TRANSFER_LEN, A1 = V_LOI * TRANSIT / TRANSFER_LEN;

function orbitPos(t, out) {

  return out.copy(EARTH_C).addScaledVector(UP, ORBIT_R * Math.cos(a)).addScaledVector(HDIR, ORBIT_R * Math.sin(a));
}
function transitPos(t, out) {
  const tau = THREE.MathUtils.clamp((t - T_TLI) / TRANSIT, 0, 1);
  const u = A0 * tau + A2 * tau * tau + A3 * tau * tau * tau;
  const u2 = u * u, u3 = u2 * u;
  return out.copy(INS_POS).multiplyScalar(2 * u3 - 3 * u2 + 1)
    .addScaledVector(LOI_POS, 3 * u2 - 2 * u3)
    .addScaledVector(HDIR, (2 * u3 - 3 * u2 + u) * TRANSFER_LEN);
}
function lunarPos(t, out) {
  const a = MOON_W * THREE.MathUtils.clamp(t - T_ARR, 0, MOON_LAP);
  return out.copy(MOON_C).addScaledVector(UP, MOON_ORBIT_R * Math.cos(a)).addScaledVector(HDIR, MOON_ORBIT_R * Math.sin(a));
}
// Whole flight path: the ascent curve, blended into orbit, then coast and lunar orbit
function pathPos(t, out) {
  const s = flightState(t);
  out.set(s.x * Math.cos(AZIMUTH), PAD_Y + s.y, s.x * Math.sin(AZIMUTH));
  if (t < T_INS) return out;
  if (t < T_TLI) {
    orbitPos(t, _orb);
    return out.lerp(_orb, THREE.MathUtils.smoothstep(t - T_INS, 0, CIRC));
  }
  if (t < T_ARR) return transitPos(t, out);
  if (t < T_DEPART) return lunarPos(t, out);
  if (t < T_RETURN) return returnCurve.getPoint((t - T_DEPART) / (T_RETURN - T_DEPART), out);
  const u = THREE.MathUtils.clamp((t - T_RETURN) / (T_SPLASH - T_RETURN), 0, 1);
  return out.copy(LANDING).addScaledVector(UP, 120 * (1 - (1 - Math.pow(1 - u, 2))));
}
function pathVel(t, out) {
  const h = 0.02;

  pathPos(t - h, _pb);
  return out.subVectors(_pa, _pb).multiplyScalar(0.5 / h);

// Camera framing in orbit: a chase frame whose "up" is the radial from the body being orbited,
// so the planet stays in view for the whole lap. Coast uses world up.
const GOAL = {                       // offsets from the spacecraft: [up, ahead, side]
  orbit: new THREE.Vector3(60, -35, 0),
  transit: new THREE.Vector3(25, -80, 0),
  lunar: new THREE.Vector3(90, -45, 0),
  return: new THREE.Vector3(35, -80, 0),
  recovery: new THREE.Vector3(20, -45, 30),

function regimeAt(t) {
  return t < T_TLI ? 'orbit' : t < T_ARR ? 'transit' : t < T_DEPART ? 'lunar' : t < T_RETURN ? 'return' : 'recovery';
}
function chaseFrame(regime, p, v) {
  const up = regime === 'orbit' ? p.clone().sub(EARTH_C).normalize()
    : regime === 'lunar' ? p.clone().sub(MOON_C).normalize()
    : UP.clone();
  const ahead = v.clone().addScaledVector(up, -v.dot(up));
  if (ahead.lengthSq() < 1e-8) ahead.copy(HDIR);
  ahead.normalize();
  return { up, ahead, side: new THREE.Vector3().crossVectors(ahead, up) };
}
function toWorld(f, a, b, c, out) {
  return out.set(0, 0, 0).addScaledVector(f.up, a).addScaledVector(f.ahead, b).addScaledVector(f.side, c);
}
let prevFrame = null;                // chase frame used last frame, to carry the camera offset across

function followMission(dt) {
  const t = Math.min(S.flight, T_END);
  const regime = regimeAt(t);
  const p = pathPos(t, _mp);
  const frame = chaseFrame(regime, p, pathVel(t, _mv));

  // Where the user's drag, zoom or the last framing shot left the camera
  _o.subVectors(camera.position, controls.target);
  if (regime !== S.regime) {         // new framing: glide from the current view
    S.regime = regime;
    S.shot = { t: 0, from: _o.clone() };
  }
  if (S.shot) {
    S.shot.t += dt;
    const g = GOAL[regime];
    toWorld(frame, g.x, g.y, g.z, _goal);
    _o.copy(S.shot.from).lerp(_goal, easeInOutCubic(Math.min(1, S.shot.t / SHOT_TIME)));
    if (S.shot.t >= SHOT_TIME) S.shot = null;

    // Keep the user's angle and zoom as the frame turns
    toWorld(frame, _o.dot(prevFrame.up), _o.dot(prevFrame.ahead), _o.dot(prevFrame.side), _o);
  }
  camera.position.copy(p).add(_o);
  controls.target.copy(p);
  prevFrame = frame;
}

const BOOSTER_TOUCHDOWN_TIME = 24.5; // seconds after separation (at S.flight = 42.5s)

function getBoosterFlight(tau) {
  const ca = Math.cos(AZIMUTH), sa = Math.sin(AZIMUTH);
  const sep = flightState(STAGE_TIME);
  const P0 = new THREE.Vector3(sep.x * ca, PAD_Y + sep.y, sep.x * sa);
  const V0 = new THREE.Vector3(sep.vx * ca, sep.vy, sep.vx * sa);
  const P_land = new THREE.Vector3(LZ_POS.x, LZ_PAD_Y, LZ_POS.z);

  const out = {
    pos: new THREE.Vector3(),
    vel: new THREE.Vector3(),
    quat: new THREE.Quaternion(),
    enginePower: 0,
    legDeploy: 0,
    gridFinDeploy: 0,
    gridFinSteer: 0,
    rcs: false,
    status: '',
    alt: 0,
    speed: 0,
    landed: false,
  };

  if (tau <= 0) {
    out.pos.copy(P0);
    out.vel.copy(V0);
    out.quat.setFromUnitVectors(UP, V0.clone().normalize());
    out.status = 'Stage separation';
    out.alt = Math.max(0, P0.y - LZ_PAD_Y);
    out.speed = V0.length();
    return out;
  }

  // Apogee waypoint at tau = 3.5s
  const P1 = new THREE.Vector3(
    P0.x + V0.x * 3.5 * 0.85,
    P0.y + V0.y * 3.5 - 11.5 * 12.25,
    P0.z + V0.z * 3.5 * 0.85
  );

  // End of boostback burn at tau = 9.0s
  const P2 = new THREE.Vector3(
    P1.x + (P_land.x - P1.x) * 0.48,
    P1.y - 180,
    P1.z + (P_land.z - P1.z) * 0.48
  );

  // Atmospheric entry point above pad at tau = 18.5s
  const P3 = new THREE.Vector3(P_land.x, LZ_PAD_Y + 160, P_land.z);

  const toPad = P_land.clone().sub(P0).normalize();
  const q_retro = new THREE.Quaternion().setFromUnitVectors(UP, toPad.clone().negate().addScaledVector(UP, 0.35).normalize());
  const q_sep = new THREE.Quaternion().setFromUnitVectors(UP, V0.clone().normalize());
  const q_up = new THREE.Quaternion().identity();

  if (tau < 3.5) {
    // Phase 1: Separation, coast to apogee, RCS pitch flip maneuver
    out.pos.set(
      P0.x + V0.x * tau * 0.85,
      P0.y + V0.y * tau - 11.5 * tau * tau,
      P0.z + V0.z * tau * 0.85
    );
    out.vel.set(V0.x * 0.85, V0.y - 23 * tau, V0.z * 0.85);
    out.enginePower = 0;
    out.gridFinDeploy = THREE.MathUtils.smoothstep(tau, 1.0, 3.0);
    out.rcs = tau >= 0.5 && tau <= 3.2;
    const flipFactor = THREE.MathUtils.smoothstep(tau, 0.5, 3.2);
    out.quat.copy(q_sep).slerp(q_retro, flipFactor);
    out.status = tau < 1.0 ? 'Stage separation' : 'RCS flip maneuver';
  } else if (tau < 9.0) {
    // Phase 2: Boostback / braking burn
    const u = (tau - 3.5) / 5.5;
    const su = THREE.MathUtils.smoothstep(u, 0, 1);
    out.pos.lerpVectors(P1, P2, su);
    out.vel.subVectors(P2, P1).multiplyScalar(1 / 5.5);
    out.enginePower = 1.0;
    out.gridFinDeploy = 1.0;
    out.quat.copy(q_retro);
    out.status = 'Boostback burn';
  } else if (tau < 18.5) {
    // Phase 3: Atmospheric guided descent
    const u = (tau - 9.0) / 9.5;
    const su = u * u;
    out.pos.set(
      THREE.MathUtils.lerp(P2.x, P3.x, THREE.MathUtils.smoothstep(u, 0, 1)),
      THREE.MathUtils.lerp(P2.y, P3.y, su),
      THREE.MathUtils.lerp(P2.z, P3.z, THREE.MathUtils.smoothstep(u, 0, 1))
    );
    out.vel.set((P3.x - P2.x) / 9.5, -45 * u, (P3.z - P2.z) / 9.5);
    out.enginePower = 0;
    out.gridFinDeploy = 1.0;
    out.gridFinSteer = Math.sin(tau * 4) * 0.12;
    const alignFactor = THREE.MathUtils.smoothstep(u, 0, 0.8);
    out.quat.copy(q_retro).slerp(q_up, alignFactor);
    out.status = 'Guided atmospheric descent';
  } else if (tau < BOOSTER_TOUCHDOWN_TIME) {
    // Phase 4: Landing burn (hoverslam)
    const burnDur = BOOSTER_TOUCHDOWN_TIME - 18.5;
    const u = (tau - 18.5) / burnDur;
    const rem = 1 - u;
    out.pos.set(
      P_land.x,
      LZ_PAD_Y + 160.0 * rem * rem,
      P_land.z
    );
    out.vel.set(0, -160.0 * 2 * rem * (1 / burnDur), 0);
    out.enginePower = Math.min(1.0, 0.6 + 0.4 * rem);
    out.gridFinDeploy = 1.0;
    out.legDeploy = THREE.MathUtils.smoothstep(tau, 20.5, 22.8);
    out.quat.copy(q_up);
    out.status = out.legDeploy > 0.05 && out.legDeploy < 0.95 ? 'Landing legs deploying' : 'Landing burn';
  } else {
    // Phase 5: Touchdown confirmed!
    out.pos.copy(P_land);
    out.vel.set(0, 0, 0);
    out.enginePower = 0;
    out.legDeploy = 1.0;
    out.gridFinDeploy = 1.0;
    out.quat.copy(q_up);
    out.status = 'Booster touchdown confirmed · Recovered!';
    out.landed = true;
  }

  out.alt = Math.max(0, out.pos.y - LZ_PAD_Y);
  out.speed = out.vel.length();
  return out;
}

function applyShake(amount) {
  camera.position.sub(shakeVec);
  shakeVec.set((Math.random() - 0.5) * amount, (Math.random() - 0.5) * amount, (Math.random() - 0.5) * amount);
  camera.position.add(shakeVec);
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ---------- Per-frame update ---------- */
function update(dt) {
  let power = 0;

  // Countdown
  if (S.phase === 'countdown') {
    S.timer += dt;
    if (S.timer < COUNTDOWN) showCount(String(Math.ceil(COUNTDOWN - S.timer)));
    else beginIgnition();
  }

  // Engine build-up; the rocket shudders while the hold-down is still on
  if (S.phase === 'ignition') {
    S.timer += dt;
    power = Math.min(1, S.timer / IGNITION_TIME);
    rocket.position.set((Math.random() - 0.5) * 0.08 * power, PAD_Y, (Math.random() - 0.5) * 0.08 * power);
    if (S.timer >= IGNITION_TIME) liftoff();
  }

  // Flight
  if (S.phase === 'flight') {
    S.flight += dt;
    const t = Math.min(S.flight, T_END);
    const orbital = t >= T_INS;
    const ca = Math.cos(AZIMUTH), sa = Math.sin(AZIMUTH);
    setSpaceView(orbital);
    power = 1;
    if (!orbital) {
      const st = flightState(S.flight);
      rocket.position.set(st.x * ca, PAD_Y + st.y, st.x * sa);
      _v.set(st.vx * ca, st.vy, st.vx * sa);
      S.alt = st.y;
    } else {
      // Orbit, coast and lunar orbit follow the scripted path; velocity comes from the path
      pathPos(t, rocket.position);
      pathVel(t, _v);
      S.alt = missionAltitude(rocket.position);
      power = burning(t) ? 1 : 0;
      earth.rotation.y += dt * 0.05;
      atmoMat.uniforms.opacity.value = earthMat.opacity = THREE.MathUtils.clamp((S.flight - T_INS) / 2, 0, 1);
    }
    const recovering = t >= T_SEPARATE;
    if (recovering && !recovery.visible) {
      recovery.add(capsule);
      capsule.position.set(0, -3, 0);
      upper.visible = false;
      recovery.visible = true;
    }
    const nearEarth = t >= T_RETURN;
    ocean.visible = nearEarth;
    if (nearEarth) earth.visible = atmo.visible = moon.visible = false;
    const glow = THREE.MathUtils.smoothstep(t, T_RETURN, T_RETURN + 2) * (1 - THREE.MathUtils.smoothstep(t, T_CHUTES - 2, T_CHUTES));
    heat.material.opacity = glow * (0.65 + 0.15 * Math.sin(t * 18));
    parachute.visible = t >= T_CHUTES && t < T_SPLASH + 2;
    parachute.scale.setScalar(Math.max(0.001, THREE.MathUtils.smoothstep(t, T_CHUTES, T_CHUTES + 2)));
    if (nearEarth) {
      const atmospheric = 1 - THREE.MathUtils.smoothstep(S.alt, 0, 120);
      skyMat.uniforms.space.value = 1 - atmospheric;
    }
    S.speed = _v.length();
    if (_v.lengthSq() > 1e-6) S.dir.copy(_v).normalize();
    rocket.quaternion.setFromUnitVectors(UP, recovering ? UP : S.dir);
    if (!S.separated && S.flight >= STAGE_TIME) {
      rocket.updateMatrixWorld(true);
      detachedBooster.position.copy(rocket.position);
      detachedBooster.quaternion.copy(rocket.quaternion);
      detachedBooster.add(booster);
      upperNozzle.visible = true;
      S.separated = true;
      S.camTarget = 'booster'; // Automatically show booster return to user
      const bCenter = detachedBooster.position.clone().add(new THREE.Vector3(0, 7, 0));
      controls.target.copy(bCenter);
      camera.position.copy(bCenter).add(new THREE.Vector3(26, 12, 26));
      controls.update();
      refreshUI();
    }
    if (S.separated) {
      const tau = S.flight - STAGE_TIME;
      const bState = getBoosterFlight(tau);
      detachedBooster.position.copy(bState.pos);
      detachedBooster.quaternion.copy(bState.quat);
      setLegsDeploy(bState.legDeploy);
      setGridFinsDeploy(bState.gridFinDeploy, bState.gridFinSteer);

      if (bState.landed && !S.boosterLanded) {
        S.boosterLanded = true;
        spawnPadSmoke(30);
        refreshUI();
      }

      // RCS cold-gas puffs during flip
      if (bState.rcs) {
        const rcsOrigin = detachedBooster.localToWorld(new THREE.Vector3(1.6, 13.5, 0));
        const rcsDir = new THREE.Vector3(1, 0, 0).applyQuaternion(detachedBooster.quaternion);
        spawn(smokePool, {
          pos: rcsOrigin,
          vel: rcsDir.clone().multiplyScalar(10),
          life: 0.25, drag: 2.0, buoy: 0,
          s0: 0.6, s1: 2.2, a: 0.6,
          c0: new THREE.Color(1, 1, 1), c1: new THREE.Color(0.85, 0.9, 0.95)
        });
      }

      // Booster engine burn
      if (bState.enginePower > 0) {
        detachedBooster.updateMatrixWorld(true);
        const bNozzle = detachedBooster.localToWorld(new THREE.Vector3(0, 0, 0));
        const bExhaustDir = new THREE.Vector3(0, -1, 0).applyQuaternion(detachedBooster.quaternion).normalize();

        bFlameAcc += dt * (60 + 120 * bState.enginePower);
        while (bFlameAcc >= 1) {
          bFlameAcc -= 1;
          spawnFlame(bNozzle, bExhaustDir, bState.enginePower);
        }
        if (bState.alt < 900) {
          bSmokeAcc += dt * 25 * bState.enginePower;
          while (bSmokeAcc >= 1) {
            bSmokeAcc -= 1;
            spawnExhaustSmoke(bNozzle, bExhaustDir, bState.enginePower);
          }
        }
        if (bState.alt < 20 && bState.alt > 0.5) {
          spawnPadSmoke(1);
        }
        boosterLight.position.copy(bNozzle).addScaledVector(bExhaustDir, 2.5);
        boosterLight.intensity = 150 * bState.enginePower * (0.85 + Math.random() * 0.3);
      } else {
        boosterLight.intensity = 0;
      }
    }
    const space = t >= T_RETURN ? THREE.MathUtils.smoothstep(S.alt, 0, 120) : orbital ? 1 : THREE.MathUtils.smoothstep(S.alt, 1200, 3800);
    skyMat.uniforms.space.value = space;
    starMaterial.opacity = space;
    scene.fog.color.copy(HORIZON).lerp(new THREE.Color(0x01020a), space);
    scene.fog.far = THREE.MathUtils.lerp(4500, 40000, space);   // no haze between the spacecraft and the Moon
    if (S.flight > 1.6 && S.shown === 'Liftoff') hideCount();
    setStatus(missionStatus(S.flight, space));
    if (S.flight >= T_END) {
      S.phase = 'finished';
      power = 0;
      setStatus('Splashdown · mission complete');
      refreshUI();
    }
  }

  // Exhaust, smoke and light
  rocket.updateMatrixWorld(true);
  const nozzle = rocket.localToWorld(_n.set(0, S.separated ? STAGE_Y - 1.4 : 0, 0));
  const exhaustDir = _e.copy(S.dir).negate();
  if (power > 0) {
    flameAcc += dt * (60 + 120 * power);
    while (flameAcc >= 1) { flameAcc -= 1; spawnFlame(nozzle, exhaustDir, power); }
    smokeAcc += dt * (S.phase === 'flight' ? 28 : 10) * power * (1 - skyMat.uniforms.space.value);
    while (smokeAcc >= 1) { smokeAcc -= 1; spawnExhaustSmoke(nozzle, exhaustDir, power); }
    exhaustLight.position.copy(nozzle).addScaledVector(exhaustDir, 3);
    exhaustLight.intensity = 160 * power * (0.85 + Math.random() * 0.3);
  } else {
    exhaustLight.intensity = 0;
  }

  // Camera: animated reset, then follow with eased pull-back
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.2);
    const e = easeInOutCubic(tween.t);
    camera.position.lerpVectors(tween.from, HOME_POS, e);
    controls.target.lerpVectors(tween.fromTarget, HOME_TARGET, e);
    if (tween.t >= 1) tween = null;
  }
  if (S.camTarget === 'booster' && S.follow && !tween && S.separated) {
    const bCenter = detachedBooster.position.clone().add(new THREE.Vector3(0, 7, 0));
    _d.subVectors(bCenter, controls.target);
    controls.target.add(_d);
    camera.position.add(_d);
  } else if (S.follow && !tween && S.flight >= T_INS && (S.phase === 'flight' || S.phase === 'finished')) {
    followMission(dt);
  } else if (S.phase === 'flight' && S.follow && !tween) {
    // Track the rocket's body exactly (an eased follow lags behind a fast-moving rocket and pushes it off-centre).
    // Camera and target move together, so the user's orbit angle and zoom survive the follow.
    _d.copy(S.dir).multiplyScalar(S.separated ? 23 : BODY_CENTER).add(rocket.position).sub(controls.target);
    controls.target.add(_d);
    camera.position.add(_d);

    // Ease the camera slightly further back as the rocket climbs away
    const goal = Math.min(1, S.flight / 25) * 0.6;
    S.pull += (goal - S.pull) * (1 - Math.exp(-dt * 1.5));
    const factor = 1 + S.pull;
    _o.subVectors(camera.position, controls.target).multiplyScalar(factor / S.factor);
    camera.position.copy(controls.target).add(_o);
    S.factor = factor;
  } else {
    S.regime = null;
    S.shot = null;
    prevFrame = null;
  }
  updateParticles(dt);
}

function updateHud() {
  if (S.camTarget === 'booster' && S.separated) {
    const bState = getBoosterFlight(S.flight - STAGE_TIME);
    setText('status', bState.status);
    setText('met', fmtMET(S.flight));
    setText('alt', bState.alt < 1000 ? `${Math.round(bState.alt)} m` : `${(bState.alt / 1000).toFixed(2)} km`);
    setText('spd', `${Math.round(bState.speed)} m/s`);
  } else {
    setText('status', S.status);
    setText('met', (S.phase === 'flight' || S.phase === 'finished') ? fmtMET(S.flight) : '—');
    setText('alt', S.flight >= T_INS ? `${Math.round(S.alt)} km` : S.alt < 1000 ? `${Math.round(S.alt)} m` : `${(S.alt / 1000).toFixed(2)} km`);
    setText('spd', `${Math.round(S.speed)} m/s`);
  }
}
const hudCache = {};
function setText(id, text) {
  if (hudCache[id] === text) return;
  hudCache[id] = text;
  $(id).textContent = text;
}
function fmtMET(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `T+ ${String(m).padStart(2, '0')}:${s.toFixed(1).padStart(4, '0')}`;
}

/* ---------- Input ---------- */
$('launch').addEventListener('click', () => {
  if (S.phase === 'idle') startCountdown();
  else if (S.phase === 'countdown') { S.paused = false; abortCountdown(); }
  else if (S.phase === 'finished') {
    resetRocket();
    S.follow = true;
    startCountdown();
  }
});
$('pause').addEventListener('click', () => {
  S.paused = !S.paused;
  if (S.paused) applyShake(0);
  refreshUI();
});
$('resetRocket').addEventListener('click', resetRocket);
$('reflightBtn').addEventListener('click', () => {
  reflyRocket();
  startCountdown();
});
$('camToggle').addEventListener('click', toggleCamTarget);
$('pipOverlay').addEventListener('click', toggleCamTarget);
$('pipBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleCamTarget();
});
$('resetCam').addEventListener('click', resetCamera);
$('zoomIn').addEventListener('click', () => zoom(0.8));
$('zoomOut').addEventListener('click', () => zoom(1.25));
$('follow').addEventListener('click', () => { S.follow = !S.follow; refreshUI(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    $('launch').click();
  } else if (e.code === 'KeyR') {
    resetCamera();
  } else if (e.code === 'KeyB') {
    if (S.flight >= STAGE_TIME) toggleCamTarget();
  } else if (e.key === '+' || e.key === '=') {
    zoom(0.8);
  } else if (e.key === '-' || e.key === '_') {
    zoom(1.25);
  }
});

// A user drag cancels any camera tween in progress
controls.addEventListener('start', () => { tween = null; S.shot = null; });

/* ---------- Sizing ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.9 ? 62 : 50;   // wider lens in portrait so the pad fits
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
setSpaceView(false);
refreshUI();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!S.paused) update(dt);
  // Open space has no ground to stop the orbit at the horizon, so the lower limit is lifted once in orbit
  controls.maxPolarAngle = S.flight >= T_INS ? Math.PI : Math.PI * 0.48;
  controls.update();
  if (!S.paused) applyShake(S.phase === 'ignition' ? S.timer / IGNITION_TIME * 0.05 : 0);
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  updateHud();
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.setScissorTest(false);
  renderer.render(scene, camera);

  // Picture-in-Picture render
  renderPip();
});

function renderPip() {
  const pipOverlay = $('pipOverlay');
  const showPip = S.phase === 'flight' && S.flight >= STAGE_TIME;
  pipOverlay.style.display = showPip ? 'flex' : 'none';
  if (!showPip) return;

  const pipViewport = $('pipViewport');
  const rect = pipViewport.getBoundingClientRect();
  if (rect.width < 10 || rect.height < 10) return;

  pipCamera.aspect = rect.width / rect.height;
  pipCamera.updateProjectionMatrix();

  if (S.camTarget === 'booster') {
    $('pipTitle').textContent = 'STAGE 2 · ASCENT';
    const altStr = S.flight >= T_INS ? `${Math.round(S.alt)} km` : `${Math.round(S.alt)} m`;
    $('pipAlt').textContent = `Alt: ${altStr}`;
    $('pipSpd').textContent = `Spd: ${Math.round(S.speed)} m/s`;
    $('pipStatus').textContent = S.status;

    const shipPos = rocket.position.clone().add(new THREE.Vector3(0, 20, 0));
    pipCamera.position.copy(shipPos).add(new THREE.Vector3(26, 12, 26));
    pipCamera.lookAt(shipPos);
  } else {
    $('pipTitle').textContent = 'STAGE 1 · RECOVERY';
    const bState = getBoosterFlight(S.flight - STAGE_TIME);
    const bAltStr = bState.alt < 1000 ? `${Math.round(bState.alt)} m` : `${(bState.alt / 1000).toFixed(2)} km`;
    $('pipAlt').textContent = `Alt: ${bAltStr}`;
    $('pipSpd').textContent = `Spd: ${Math.round(bState.speed)} m/s`;
    $('pipStatus').textContent = bState.status;

    const bCenter = detachedBooster.position.clone().add(new THREE.Vector3(0, 7, 0));
    pipCamera.position.copy(bCenter).add(new THREE.Vector3(24, 10, 24));
    pipCamera.lookAt(bCenter);
  }

  sky.position.copy(pipCamera.position);
  stars.position.copy(pipCamera.position);

  const left = Math.round(rect.left);
  const bottom = Math.round(window.innerHeight - rect.bottom);
  const width = Math.round(rect.width);
  const height = Math.round(rect.height);

  renderer.setViewport(left, bottom, width, height);
  renderer.setScissor(left, bottom, width, height);
  renderer.setScissorTest(true);
  renderer.render(scene, pipCamera);
  renderer.setScissorTest(false);
}
</script>
</body>
</html>
