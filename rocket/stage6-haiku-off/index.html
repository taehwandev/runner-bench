<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rocket Launch · 3D</title>
<style>
  :root {
    --panel: rgba(12, 22, 36, 0.55);
    --text: #f5f8fb;
    --muted: #c3d3e0;
    --amber: #ffd27a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: #9fd3f0;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  .panel {
    position: fixed;
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  }

  .title { top: 16px; left: 16px; padding: 12px 16px; max-width: 260px; }
  .title h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
  .title p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  .telemetry {
    top: 16px; right: 16px;
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 10px 24px;
    padding: 12px 16px;
  }
  .telemetry span {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .telemetry strong { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #status { color: var(--amber); }

  .countdown {
    position: fixed;
    left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    font-size: clamp(64px, 14vw, 160px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .countdown.show { opacity: 1; }
  .countdown.pulse { animation: pulse 0.9s ease-out; }
  .countdown.paused { animation-play-state: paused; }
  @keyframes pulse {
    0%   { transform: translate(-50%, -50%) scale(1.25); opacity: 0.2; }
    30%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .controls {
    left: 50%;
    bottom: calc(44px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 10px;
  }
  .btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    min-height: 44px;
    min-width: 44px;
    padding: 0 16px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s, background 0.2s, opacity 0.2s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.2); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn[aria-pressed="false"] { opacity: 0.75; }
  .btn.primary {
    background: linear-gradient(135deg, #ff8a3d, #ff4d2e);
    border-color: transparent;
    padding: 0 28px;
    font-size: 16px;
    box-shadow: 0 6px 18px rgba(255, 90, 40, 0.4);
  }
  .btn.primary.abort { background: linear-gradient(135deg, #8d99a8, #56606d); box-shadow: none; }

  .hint {
    position: fixed;
    left: 50%; bottom: 12px;
    transform: translateX(-50%);
    margin: 0;
    font-size: 12px;
    color: #fff;
    background: rgba(0, 0, 0, 0.25);
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .title { top: 10px; left: 10px; right: 10px; max-width: none; padding: 8px 12px; }
    .title h1 { font-size: 15px; }
    .title p { font-size: 11px; }
    .telemetry {
      top: 70px; left: 10px; right: 10px;
      grid-template-columns: 1.2fr 1.5fr 1fr 1fr;
      gap: 8px;
      padding: 8px 10px;
    }
    .telemetry span { font-size: 9px; letter-spacing: 0.04em; }
    .telemetry strong { font-size: 13px; white-space: normal; }
    .controls {
      left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
      transform: none; width: auto; max-width: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .controls .primary { grid-column: 1 / -1; min-height: 52px; }
    .btn { min-height: 48px; padding: 0 8px; font-size: 13px; }
    .hint { display: none; }
  }

  @media (max-height: 500px) and (orientation: landscape), (max-height: 460px) {
    .hint { display: none !important; }
    .title {
      top: 8px; left: calc(8px + env(safe-area-inset-left));
      right: auto; max-width: 220px;
      padding: 6px 10px;
      border-radius: 10px;
    }
    .title h1 { font-size: 13px; }
    .title p { font-size: 10px; margin: 2px 0 0; }
    .telemetry {
      top: 8px; right: calc(8px + env(safe-area-inset-right));
      left: auto;
      grid-template-columns: repeat(2, auto);
      gap: 4px 16px;
      padding: 6px 10px;
      border-radius: 10px;
    }
    .telemetry span { font-size: 9px; letter-spacing: 0.04em; }
    .telemetry strong { font-size: 12px; white-space: nowrap; }
    .controls {
      left: 50%;
      right: auto;
      bottom: calc(8px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
      max-height: calc(100vh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 6px;
      padding: 5px 8px;
      border-radius: 12px;
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .controls::-webkit-scrollbar { display: none; }
    .btn {
      min-height: 34px;
      min-width: 32px;
      padding: 0 8px;
      font-size: 12px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .controls .primary {
      grid-column: auto;
      min-height: 34px;
      padding: 0 14px;
      font-size: 12px;
    }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene" aria-label="3D view of a rocket on a launch pad"></canvas>

<header class="panel title">
  <h1>Launch Complex</h1>
  <p>Drag to orbit · Scroll or pinch to zoom</p>
</header>

<section class="panel telemetry" aria-live="polite">
  <div><span>Status</span><strong id="status">Standing by</strong></div>
  <div><span>Mission time</span><strong id="met">—</strong></div>
  <div><span>Altitude</span><strong id="alt">0 m</strong></div>
  <div><span>Speed</span><strong id="spd">0 m/s</strong></div>
</section>

<div id="count" class="countdown" aria-live="assertive"></div>

<nav class="panel controls" aria-label="Launch and camera controls">
  <button id="launch" class="btn primary" type="button">Launch</button>
  <button id="pause" class="btn" type="button" disabled>Pause</button>
  <button id="zoomOut" class="btn" type="button" aria-label="Zoom out">Zoom −</button>
  <button id="zoomIn" class="btn" type="button" aria-label="Zoom in">Zoom +</button>
  <button id="follow" class="btn" type="button" aria-pressed="true">Follow: on</button>
  <button id="resetCam" class="btn" type="button">Reset camera</button>
  <button id="resetRocket" class="btn" type="button">Reset rocket</button>
</nav>

<p class="hint desk-only">Space: launch · R: reset camera · +/−: zoom</p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- Tunables ---------- */
const PAD_Y = 3;                       // top of the launch mount; the nozzle sits here
const COUNTDOWN = 10;                  // seconds
const STAGE_TIME = 18;               // separation after the vehicle clears the tower
const STAGE_Y = 14;                  // joint above the first-stage nozzle
const IGNITION_TIME = 3;               // engine build-up before the hold-down releases
const ASCENT_V = 85, ASCENT_TAU = 4;   // vertical speed target (m/s) and response time (s)
const DRIFT_V = 110, DRIFT_TAU = 5;    // downrange speed target and response time
const DRIFT_START = 5;                 // seconds before the pitch-over begins
const AZIMUTH = -0.55;                 // heading of travel (radians)
const BODY_CENTER = 16;                // orbit pivot height above the nozzle, the middle of the hull
const HOME_TARGET = new THREE.Vector3(0, PAD_Y + BODY_CENTER, 0);
const HOME_POS = new THREE.Vector3(46, 20 + (HOME_TARGET.y - 15), 62);   // same view angle as before, shifted with the target
const SUN_DIR = new THREE.Vector3(80, 140, -60).normalize();
const UP = new THREE.Vector3(0, 1, 0);

/* ---------- Renderer, scene, camera ---------- */
const $ = id => document.getElementById(id);
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xcde9f7);
scene.fog = new THREE.Fog(HORIZON, 700, 4500);

const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 12000);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;            // pan would fight the follow camera and two-finger zoom on touch
controls.minDistance = 14;
controls.maxDistance = 400;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

/* ---------- Sky ---------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    top: { value: new THREE.Color(0x3b7fdc) },
    horizon: { value: HORIZON },
    bottom: { value: new THREE.Color(0xbfe6f5) },
    sunDir: { value: SUN_DIR },
    space: { value: 0 },
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; uniform vec3 sunDir; uniform float space;
    varying vec3 vDir;
    void main() {
      float h = vDir.y;
      vec3 col = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, bottom, min(-h * 4.0, 1.0));
      float s = max(dot(normalize(vDir), sunDir), 0.0);
      col += vec3(1.0, 0.95, 0.8) * (pow(s, 600.0) * 1.5 + pow(s, 8.0) * 0.25);
      col = mix(col, vec3(0.002, 0.004, 0.015), space);
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 32, 16), skyMat);
sky.frustumCulled = false;
scene.add(sky);
const starPositions = [];
const starRand = mulberry32(8942);
for (let i = 0; i < 1800; i++) {
  const y = starRand() * 2 - 1, a = starRand() * Math.PI * 2;
  const r = Math.sqrt(1 - y * y) * 5500;
  starPositions.push(Math.cos(a) * r, y * 5500, Math.sin(a) * r);
}
const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 5, transparent: true, opacity: 0, depthWrite: false, fog: false });
const stars = new THREE.Points(starGeometry, starMaterial);
stars.frustumCulled = false;
scene.add(stars);

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight(0xcfeeff, 0x5d8a3c, 1.4));
const sun = new THREE.DirectionalLight(0xfff3dc, 2.4);
sun.position.copy(SUN_DIR).multiplyScalar(200);
scene.add(sun);
const exhaustLight = new THREE.PointLight(0xff9a3c, 0, 90, 2);
scene.add(exhaustLight);

/* ---------- Helpers ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(2026);         // scenery layout is seeded so it's identical every load

function box(parent, mat, size, pos) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(...size), mat);
  m.position.set(...pos);
  parent.add(m);
  return m;
}

function makeGroundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#6fa34b';
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `hsla(${95 + rand() * 25}, ${40 + rand() * 25}%, ${30 + rand() * 25}%, 0.25)`;
    g.beginPath();
    g.arc(rand() * 256, rand() * 256, 1 + rand() * 4, 0, Math.PI * 2);
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(200, 200);
  t.anisotropy = 8;
  return t;
}

// Everything that belongs to the ground; hidden once the spacecraft is in orbit
const terrain = new THREE.Group();
scene.add(terrain);

/* ---------- Ground ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(12000, 12000),
  new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
terrain.add(ground);

/* ---------- Launch complex ---------- */
const concrete = new THREE.MeshStandardMaterial({ color: 0xcfcbc1, roughness: 0.95 });
const steel = new THREE.MeshStandardMaterial({ color: 0x8c97a3, metalness: 0.55, roughness: 0.45 });

// Apron and a square mount with a 4×4 flame hole in the middle
const pad = new THREE.Group();
terrain.add(pad);
box(pad, concrete, [70, 0.06, 70], [0, 0.03, 0]);
box(pad, concrete, [12, 3, 4], [0, 1.5, 4]);
box(pad, concrete, [12, 3, 4], [0, 1.5, -4]);
box(pad, concrete, [4, 3, 4], [4, 1.5, 0]);
box(pad, concrete, [4, 3, 4], [-4, 1.5, 0]);

// Lightning/service tower beside the pad
const tower = new THREE.Group();
tower.position.set(-12, 0, 0);
terrain.add(tower);
for (const [x, z] of [[-2, -2], [2, -2], [-2, 2], [2, 2]]) box(tower, steel, [0.5, 40, 0.5], [x, 20, z]);
for (let y = 4; y <= 38; y += 4) {
  box(tower, steel, [4.5, 0.35, 0.35], [0, y, -2]);
  box(tower, steel, [4.5, 0.35, 0.35], [0, y, 2]);
  box(tower, steel, [0.35, 0.35, 4.5], [-2, y, 0]);
  box(tower, steel, [0.35, 0.35, 4.5], [2, y, 0]);
}
box(tower, steel, [5.5, 0.6, 5.5], [0, 40, 0]);

/* ---------- Rocket ---------- */
// Local origin = bottom of the nozzle, so the exhaust starts at (0, 0, 0)
function buildRocket() {
  const g = new THREE.Group();
  const booster = new THREE.Group();
  const upper = new THREE.Group();
  g.add(booster, upper);
  const hull = new THREE.MeshStandardMaterial({ color: 0xf2f4f7, metalness: 0.15, roughness: 0.35 });
  const red = new THREE.MeshStandardMaterial({ color: 0xd62f22, roughness: 0.4 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x3a3f47, metalness: 0.7, roughness: 0.4 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x1d3b5c, metalness: 0.6, roughness: 0.15 });

  const toV2 = pts => pts.map(([x, y]) => new THREE.Vector2(x, y));
  const body = new THREE.Mesh(new THREE.LatheGeometry(toV2([
    [1.6, STAGE_Y], [1.6, 24], [1.45, 25], [1.2, 27], [0.85, 29.8], [0.4, 31.8], [0.01, 33.2],
  ]), 48), hull);
  const nozzle = new THREE.Mesh(new THREE.LatheGeometry(toV2([
    [1.0, 0], [1.25, 0.9], [1.5, 2.1],
  ]), 48), dark);
  const boosterBody = new THREE.Mesh(new THREE.LatheGeometry(toV2([
    [1.5, 2], [1.6, 2.6], [1.6, STAGE_Y],
  ]), 48), hull);
  booster.add(boosterBody, nozzle);
  upper.add(body);
  const upperNozzle = new THREE.Mesh(new THREE.LatheGeometry(toV2([
    [0.65, STAGE_Y - 1.4], [0.85, STAGE_Y - 0.6], [1.0, STAGE_Y],
  ]), 48), dark);
  upperNozzle.visible = false;
  upper.add(upperNozzle);

  // Orion-style crew capsule on a service module, on top of the upper stage
  const orion = new THREE.Group();
  orion.position.y = 33.2;
  const serviceModule = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 3, 32), dark);
  serviceModule.position.y = 1.5;
  const capsule = new THREE.Mesh(new THREE.LatheGeometry(toV2([
    [1.2, 3], [1.15, 3.6], [0.9, 4.4], [0.5, 5], [0.15, 5.3], [0.01, 5.35],
  ]), 48), hull);
  orion.add(serviceModule, capsule);
  upper.add(orion);

  for (const y of [8, 20]) {
    const band = new THREE.Mesh(new THREE.CylinderGeometry(1.63, 1.63, 1.2, 48, 1, true), red);
    band.position.y = y;
    (y < STAGE_Y ? booster : upper).add(band);
  }

  const porthole = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 16), glass);
  porthole.position.set(0, 16, 1.6);
  porthole.scale.set(1, 1.3, 0.35);
  upper.add(porthole);

  const finShape = new THREE.Shape();
  finShape.moveTo(1.2, 2.2);
  finShape.lineTo(4.4, 2.2);
  finShape.lineTo(1.6, 10.5);
  finShape.lineTo(1.2, 10.5);
  finShape.closePath();
  const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.3, bevelEnabled: false });
  finGeo.translate(0, 0, -0.15);
  for (let i = 0; i < 4; i++) {
    const fin = new THREE.Mesh(finGeo, red);
    fin.rotation.y = i * Math.PI / 2;
    booster.add(fin);
  }
  return { g, booster, upperNozzle };
}
const { g: rocket, booster, upperNozzle } = buildRocket();
rocket.position.set(0, PAD_Y, 0);
scene.add(rocket);
const detachedBooster = new THREE.Group();
scene.add(detachedBooster);

/* ---------- Scenery ---------- */
// Trees
const trunkGeo = new THREE.CylinderGeometry(0.35, 0.5, 3, 6);
const pineGeo = new THREE.ConeGeometry(2.6, 7, 7);
const roundGeo = new THREE.IcosahedronGeometry(2.6, 0);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6d4c30, roughness: 1 });
const greens = [0x2f6b3a, 0x3b7d3f, 0x4f8f3e].map(c =>
  new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9 }));
for (let i = 0; i < 260; i++) {
  const a = rand() * Math.PI * 2;
  const r = 60 + Math.pow(rand(), 0.7) * 1200;
  const pine = rand() < 0.55;
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1.5;
  const crown = new THREE.Mesh(pine ? pineGeo : roundGeo, greens[Math.floor(rand() * greens.length)]);
  crown.position.y = pine ? 6.5 : 5.2;
  tree.add(trunk, crown);
  tree.scale.setScalar(0.8 + rand() * 1.1);
  tree.rotation.y = rand() * 6;
  tree.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  terrain.add(tree);
}

// Rolling hills
const hillMats = [0x6f9b5c, 0x5e8c55, 0x7aa566].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 1 }));
const hillGeo = new THREE.SphereGeometry(1, 28, 14);
for (let i = 0; i < 26; i++) {
  const a = (i / 26) * Math.PI * 2 + rand() * 0.2;
  const r = 1400 + rand() * 400;
  const rx = 260 + rand() * 260, ry = 90 + rand() * 110;
  const hill = new THREE.Mesh(hillGeo, hillMats[i % hillMats.length]);
  hill.scale.set(rx, ry, rx * 0.8);
  hill.position.set(Math.cos(a) * r, ry * 0.2, Math.sin(a) * r);
  terrain.add(hill);
}

// Distant mountains with snow caps
const mountainMat = new THREE.MeshStandardMaterial({ color: 0x7d8fa6, flatShading: true, roughness: 1 });
const snowMat = new THREE.MeshStandardMaterial({ color: 0xf4f8fb, flatShading: true, roughness: 0.8 });
for (let i = 0; i < 18; i++) {
  const a = rand() * Math.PI * 2;
  const r = 2600 + rand() * 900;
  const h = 500 + rand() * 600;
  const rad = h * (0.5 + rand() * 0.3);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const m = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 7), mountainMat);
  m.position.set(x, h / 2, z);
  const snow = new THREE.Mesh(new THREE.ConeGeometry(rad * 0.38, h * 0.28, 7), snowMat);
  snow.position.set(x, h * 0.86, z);
  terrain.add(m, snow);
}

// Clouds
const cloudGeo = new THREE.IcosahedronGeometry(1, 2);
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xdde6ef, emissiveIntensity: 0.25 });
for (let i = 0; i < 26; i++) {
  const cloud = new THREE.Group();
  const puffs = 5 + Math.floor(rand() * 4);
  for (let j = 0; j < puffs; j++) {
    const p = new THREE.Mesh(cloudGeo, cloudMat);
    p.position.set((rand() - 0.5) * 44, (rand() - 0.5) * 6, (rand() - 0.5) * 18);

function updateParticles(dt) {
  for (const pool of [flamePool, smokePool]) {
    for (const p of pool) {
      if (!p.alive) continue;
      p.t += dt;
      const f = p.t / p.life;
      if (f >= 1) { p.alive = false; p.sprite.visible = false; continue; }
      p.vel.multiplyScalar(Math.exp(-p.drag * dt));
      p.vel.y += p.buoy * dt;

// Closed-form ascent: rises quickly, then pitches over and keeps climbing away (never returns).
function flightState(s) {
  const u = Math.max(0, s - DRIFT_START);
  const ev = Math.exp(-s / ASCENT_TAU);
  const ed = Math.exp(-u / DRIFT_TAU);
  return {
    x: DRIFT_V * (u - DRIFT_TAU * (1 - ed)),   // downrange distance
    y: ASCENT_V * (s - ASCENT_TAU * (1 - ev)), // altitude above the pad
    vx: DRIFT_V * (1 - ed),
    vy: ASCENT_V * (1 - ev),
  };
}

    const t = Math.min(S.flight, T_END);
    const orbital = t >= T_INS;
    const ca = Math.cos(AZIMUTH), sa = Math.sin(AZIMUTH);
    setSpaceView(orbital);
    power = 1;
    if (!orbital) {
      const st = flightState(S.flight);
      rocket.position.set(st.x * ca, PAD_Y + st.y, st.x * sa);
      _v.set(st.vx * ca, st.vy, st.vx * sa);
      S.alt = st.y;
    } else {
      // Orbit, coast and lunar orbit follow the scripted path; velocity comes from the path
      pathPos(t, rocket.position);
      pathVel(t, _v);
      S.alt = missionAltitude(rocket.position);
      power = burning(t) ? 1 : 0;
      earth.rotation.y += dt * 0.05;
      atmoMat.uniforms.opacity.value = earthMat.opacity = THREE.MathUtils.clamp((S.flight - T_INS) / 2, 0, 1);
    }
    S.speed = _v.length();
    if (_v.lengthSq() > 1e-6) S.dir.copy(_v).normalize();
    rocket.quaternion.setFromUnitVectors(UP, S.dir);
    if (!S.separated && S.flight >= STAGE_TIME) {
      rocket.updateMatrixWorld(true);
      detachedBooster.position.copy(rocket.position);
      detachedBooster.quaternion.copy(rocket.quaternion);
      detachedBooster.add(booster);
      upperNozzle.visible = true;
      S.separated = true;
    }
    if (S.separated) {
      const elapsed = S.flight - STAGE_TIME;
      // The spent stage coasts briefly, then drops and tumbles away.
      const sep = flightState(STAGE_TIME);
      detachedBooster.position.set(
        sep.x * ca + sep.vx * ca * elapsed * 0.35,
        PAD_Y + sep.y + sep.vy * elapsed * 0.35 - 7 * elapsed * elapsed,
        sep.x * sa + sep.vx * sa * elapsed * 0.35
      );
      detachedBooster.rotation.z += dt * 0.3;
    }
    const space = orbital ? 1 : THREE.MathUtils.smoothstep(S.alt, 1200, 3800);
    skyMat.uniforms.space.value = space;
    starMaterial.opacity = space;
    scene.fog.color.copy(HORIZON).lerp(new THREE.Color(0x01020a), space);
    scene.fog.far = THREE.MathUtils.lerp(4500, 40000, space);   // no haze between the spacecraft and the Moon
    if (S.flight > 1.6 && S.shown === 'Liftoff') hideCount();
    setStatus(missionStatus(S.flight, space));
    if (S.flight >= T_END) {
      S.phase = 'finished';
      power = 0;
      setStatus('Mission complete');
      refreshUI();
    }
  }

  // Exhaust, smoke and light
  rocket.updateMatrixWorld(true);
  const nozzle = rocket.localToWorld(_n.set(0, S.separated ? STAGE_Y - 1.4 : 0, 0));
  const exhaustDir = _e.copy(S.dir).negate();
  if (power > 0) {
    flameAcc += dt * (60 + 120 * power);
    while (flameAcc >= 1) { flameAcc -= 1; spawnFlame(nozzle, exhaustDir, power); }
    smokeAcc += dt * (S.phase === 'flight' ? 28 : 10) * power * (1 - skyMat.uniforms.space.value);
    while (smokeAcc >= 1) { smokeAcc -= 1; spawnExhaustSmoke(nozzle, exhaustDir, power); }
    exhaustLight.position.copy(nozzle).addScaledVector(exhaustDir, 3);
    exhaustLight.intensity = 160 * power * (0.85 + Math.random() * 0.3);
  } else {
    exhaustLight.intensity = 0;
  }

  // Camera: animated reset, then follow with eased pull-back
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.2);
    const e = easeInOutCubic(tween.t);
    camera.position.lerpVectors(tween.from, HOME_POS, e);
    controls.target.lerpVectors(tween.fromTarget, HOME_TARGET, e);
    if (tween.t >= 1) tween = null;
  }
  if (S.follow && !tween && S.flight >= T_INS && (S.phase === 'flight' || S.phase === 'finished')) {
    followMission(dt);
  } else if (S.phase === 'flight' && S.follow && !tween) {
    // Track the rocket's body exactly (an eased follow lags behind a fast-moving rocket and pushes it off-centre).
    // Camera and target move together, so the user's orbit angle and zoom survive the follow.
    _d.copy(S.dir).multiplyScalar(S.separated ? 23 : BODY_CENTER).add(rocket.position).sub(controls.target);
    controls.target.add(_d);
    camera.position.add(_d);

    // Ease the camera slightly further back as the rocket climbs away
    const goal = Math.min(1, S.flight / 25) * 0.6;
    S.pull += (goal - S.pull) * (1 - Math.exp(-dt * 1.5));
    const factor = 1 + S.pull;
    _o.subVectors(camera.position, controls.target).multiplyScalar(factor / S.factor);
    camera.position.copy(controls.target).add(_o);
    S.factor = factor;
  } else {
    S.regime = null;
    S.shot = null;
    prevFrame = null;
  }
  updateParticles(dt);
}

function updateHud() {
  setText('status', S.status);
  setText('met', (S.phase === 'flight' || S.phase === 'finished') ? fmtMET(S.flight) : '—');
  setText('alt', S.flight >= T_INS ? `${Math.round(S.alt)} km` : S.alt < 1000 ? `${Math.round(S.alt)} m` : `${(S.alt / 1000).toFixed(2)} km`);
  setText('spd', `${Math.round(S.speed)} m/s`);
}
const hudCache = {};
function setText(id, text) {
  if (hudCache[id] === text) return;
  hudCache[id] = text;
  $(id).textContent = text;
}
function fmtMET(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `T+ ${String(m).padStart(2, '0')}:${s.toFixed(1).padStart(4, '0')}`;
}

/* ---------- Input ---------- */
$('launch').addEventListener('click', () => {
  if (S.phase === 'idle') startCountdown();
  else if (S.phase === 'countdown') { S.paused = false; abortCountdown(); }
  else if (S.phase === 'finished') {
    resetRocket();
    S.follow = true;
    startCountdown();
  }
});
$('pause').addEventListener('click', () => {
  S.paused = !S.paused;
  if (S.paused) applyShake(0);
  refreshUI();
});
$('resetRocket').addEventListener('click', resetRocket);
$('resetCam').addEventListener('click', resetCamera);
$('zoomIn').addEventListener('click', () => zoom(0.8));
$('zoomOut').addEventListener('click', () => zoom(1.25));
$('follow').addEventListener('click', () => { S.follow = !S.follow; refreshUI(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    $('launch').click();
  } else if (e.code === 'KeyR') {
    resetCamera();
  } else if (e.key === '+' || e.key === '=') {
    zoom(0.8);
  } else if (e.key === '-' || e.key === '_') {
    zoom(1.25);
  }
});

// A user drag cancels any camera tween in progress
controls.addEventListener('start', () => { tween = null; S.shot = null; });

/* ---------- Sizing ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.9 ? 62 : 50;   // wider lens in portrait so the pad fits
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
setSpaceView(false);
refreshUI();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!S.paused) update(dt);
  // Open space has no ground to stop the orbit at the horizon, so the lower limit is lifted once in orbit
  controls.maxPolarAngle = S.flight >= T_INS ? Math.PI : Math.PI * 0.48;
  controls.update();
  if (!S.paused) applyShake(S.phase === 'ignition' ? S.timer / IGNITION_TIME * 0.05 : 0);
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  updateHud();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
